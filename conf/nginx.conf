# This file is a template for YunoHost (ynh_config_add_nginx).
# __PATH__ and __PORT__ are replaced by YunoHost.
#
# CRITICAL NOTE (Pitfall 4 / RESEARCH.md):
# - WebSocket headers are REQUIRED for LibreChat real-time features.
#   Without proxy_http_version 1.1 + Upgrade headers, WebSockets silently fail.
# - proxy_buffering off is REQUIRED for SSE (LLM response streaming). Without
#   it, chat responses appear to hang until fully complete (possibly minutes).
# Without these settings the chat appears completely broken, with no error.

location __PATH__/ {

  proxy_pass http://127.0.0.1:__PORT__;

  # WebSocket support (required for LibreChat real-time features)
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  # SSE streaming support (required for LLM response streaming)
  proxy_buffering off;
  proxy_cache off;

  # Standard proxy headers
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  include proxy_params_no_auth;

  client_max_body_size 100M;
}
