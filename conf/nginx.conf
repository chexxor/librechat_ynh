# This file is a template for YunoHost (ynh_config_add_nginx).
# __PATH__ and __PORT__ are replaced by YunoHost.
#
# WebSocket + SSE notes (verified by the Phase 6 live package_check run):
# - The `include proxy_params_no_auth` below already provides WebSocket support:
#   `proxy_http_version 1.1`, `Upgrade`, and `Connection` headers. Setting them
#   here as well caused an nginx `"proxy_http_version" directive is duplicate`
#   fatal error and aborted install. They are therefore NOT repeated here.
# - `proxy_buffering off` is REQUIRED for SSE (LLM response streaming). Without
#   it, chat responses appear to hang until fully complete (possibly minutes).
#   This is not part of proxy_params_no_auth, so it stays.

location __PATH__/ {

  proxy_pass http://127.0.0.1:__PORT__;

  # SSE streaming support (required for LLM response streaming)
  proxy_buffering off;
  proxy_cache off;

  include proxy_params_no_auth;

  client_max_body_size 100M;
}
